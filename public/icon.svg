<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Study Orbital 앱 아이콘. 앱 항로맵의 함선 실루엣을 그대로 키워 쓴다. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#132242"/>
      <stop offset="55%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ae8ff"/>
      <stop offset="45%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8f6bff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8f6bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 별 -->
  <g fill="#ffffff">
    <circle cx="86" cy="96" r="3.2" opacity="0.75"/>
    <circle cx="428" cy="74" r="2.4" opacity="0.55"/>
    <circle cx="452" cy="196" r="2.8" opacity="0.6"/>
    <circle cx="64" cy="300" r="2.2" opacity="0.5"/>
    <circle cx="120" cy="428" r="2.6" opacity="0.55"/>
    <circle cx="404" cy="404" r="3.0" opacity="0.65"/>
    <circle cx="330" cy="60" r="1.8" opacity="0.45"/>
    <circle cx="180" cy="70" r="1.6" opacity="0.4"/>
    <circle cx="470" cy="310" r="1.8" opacity="0.45"/>
    <circle cx="40" cy="180" r="1.7" opacity="0.4"/>
  </g>

  <!-- 궤도 고리 (함선 뒤로 지나가는 앞부분은 아래에서 다시 그린다) -->
  <g transform="rotate(-18 256 268)">
    <ellipse cx="256" cy="268" rx="196" ry="64" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.85" filter="url(#glow)"/>
    <circle cx="98" cy="300" r="11" fill="#8f6bff" filter="url(#glow)"/>
  </g>

  <!-- 함선 (항로맵 ShipGlyph와 같은 곡선, 12.5배) -->
  <g transform="translate(256,242) scale(12.5)" filter="url(#glow)">
    <path d="M0,-15 C3.5,-8 6,-1 6.5,7 L3,10 L-3,10 L-6.5,7 C-6,-1 -3.5,-8 0,-15 Z"
      fill="#0d1b2a" stroke="#e8f7ff" stroke-width="1.15" stroke-linejoin="round"/>
    <path d="M0,-15 C1.6,-11.5 2.7,-8 3.3,-4.2 C1.2,-5.4 -1.2,-5.4 -3.3,-4.2 C-2.7,-8 -1.6,-11.5 0,-15 Z"
      fill="#00d4ff" opacity="0.9"/>
    <circle cx="0" cy="1.5" r="2.1" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
    <circle cx="0" cy="1.5" r="0.9" fill="#00d4ff"/>
    <path d="M-2.2,10 L0,19 L2.2,10 Z" fill="url(#flame)"/>
  </g>
</svg>
